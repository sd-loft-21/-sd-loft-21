      display: flex; background: var(--bg-concrete); border: 1px solid var(--border-loft);

    .nav-btn {

    }
    .nav-btn.active { background: var(--brick); color: #fff; }
    .card {
      background: var(--bg-concrete); border: 1px solid var(--border-loft);
      border-radius: 22px; padding: 24px; margin-top: 22px;
    }
    .badge {
      display: inline-flex; align-items: center; gap: 6px;
      background: #2A1D17; border: 1px solid #5C3422; color: var(--edison);

    h1 { font-size: clamp(24px, 4vw, 42px); font-weight: 900; line-height: 1.15; margin: 14px 0 10px; }
    h2 { font-size: clamp(19px, 2.6vw, 26px); font-weight: 900; }
    .muted { color: var(--text-muted); font-size: 14px; }
    .utp-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin: 18px 0; }
    .utp-item { background: var(--bg-iron); border: 1px solid var(--border-loft); border-radius: 14px; padding: 12px; }
    .utp-val { color: var(--edison); font-size: 17px; font-weight: 900; }

    .loft-switch { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 12px; }
    .loft-btn {

    .loft-btn.active { background: var(--brick); border-color: var(--edison); color: #fff; }

    .day-cell {

    const isMiniOnly = window.location.search.indexOf("mode=mini") !== -1;
    const state = {
      tab: isMiniOnly ? "mini" : "site",
      loft: "bogdanka",
      zoneIdx: 0,
      month: "2026-12",
      date: "2026-12-05",
      mode: "daily",
      hours: [17, 18, 19, 20],
      guests: 20,
      hookah: false,
      techHour: false,
      promoCode: "",
      promoOk: false,
      name: "",

      comment: "",
      adminOk: false,
      scriptUrl: CONFIG.GOOGLE_SCRIPT_URL || localStorage.getItem("sd_loft_gas_url") || "",
      customPrices: {}
    };

      const el = document.getElementById("toast");
      el.textContent = msg;
      el.style.display = "block";
      clearTimeout(window.__toastT);
      window.__toastT = setTimeout(() => { el.style.display = "none"; }, 4000);
    }

    function loadLiveBlocked() {
      if (!state.scriptUrl) return;
      fetch(state.scriptUrl)
        .then(r => r.json())
        .then(d => {
          if (d && d.ok && d.blocked) {
            CONFIG.BLOCKED.bogdanka = Array.from(new Set(CONFIG.BLOCKED.bogdanka.concat(d.blocked.bogdanka || [])));
            CONFIG.BLOCKED.tekstil = Array.from(new Set(CONFIG.BLOCKED.tekstil.concat(d.blocked.tekstil || [])));
            if (d.customPrices) state.customPrices = d.customPrices;
            render();
          }
        })
        .catch(() => {});
    }

    function getRate(dateStr, loftId) {
      const sp = state.customPrices[dateStr] || CONFIG.SPECIAL_DAILY[dateStr];
      if (sp) {
        const h = Math.round((sp / 6.67) / 100) * 100;
        return { hour: h, daily: sp, label: dateStr === "2026-12-31" ? "Новогодняя ночь" : "Предновогодний / праздничный тариф" };
      }
      const p = dateStr.split("-").map(Number);
      const dow = new Date(p[0], p[1] - 1, p[2]).getDay();
      const b = CONFIG.BASE_RATES[loftId];
      if (dow === 6) return { hour: b.saturday[0], daily: b.saturday[1], label: "Суббота" };
      if (dow === 5 || dow === 0) return { hour: b.friSun[0], daily: b.friSun[1], label: "Пятница / Воскресенье" };
      return { hour: b.weekday[0], daily: b.weekday[1], label: "Будни Пн–Чт" };
    }

    function calc() {
      const r = getRate(state.date, state.loft);
      const hrs = Math.max(3, state.hours.length);
      const rawH = hrs * r.hour;
      const suggestDaily = state.mode === "hourly" && rawH >= r.daily;
      const base = state.mode === "daily" ? r.daily : rawH;
      let gExtra = 0;
      if (state.guests > 20 && state.guests <= 25) gExtra = 1000;
      else if (state.guests > 25 && state.guests <= 30) gExtra = 2000;
      else if (state.guests > 30) gExtra = 2000 + (state.guests - 30) * 500;
      const extras = (state.hookah ? CONFIG.HOOKAH_RUB : 0) + (state.techHour ? Math.round(r.hour * 0.5) : 0);
      const disc = state.promoOk ? Math.round(base * 0.10) : 0;
      const total = base + gExtra + extras - disc;
      return { r, hrs, base, suggestDaily, gExtra, extras, disc, total, rest: Math.max(0, total - CONFIG.PREPAYMENT_RUB) };
    }

    function fmt(n) { return Number(n).toLocaleString("ru-RU"); }

    function buildEstimateText(idStr) {
      const c = calc();
      const slot = state.mode === "daily" ? "Сутки (16:00–04:00)" : ("Почасовая (" + c.hrs + " ч)");
      return (

        "Гостей: " + state.guests + " чел.\n" +
        (state.hookah ? "Кальян: +1 000 ₽\n" : "") +

        "Предоплата брони: 3 000 ₽ (возвратный залог при заезде: 3 000 ₽)\n" +
        (state.name ? "Имя: " + state.name + "\n" : "") +
        (state.phone ? "Телефон: " + state.phone : "")
      );
    }

      const txt = buildEstimateText(idStr);
      if (navigator.clipboard) navigator.clipboard.writeText(txt).catch(() => {});
      const enc = encodeURIComponent(txt);
      if (ch === "Telegram") window.open("https://t.me/" + CONFIG.TG_USERNAME + "?text=" + enc, "_blank");

            timeLabel: timeLabel, hoursCount: c.hrs, guests: state.guests,
            baseRub: c.base, guestSurchargeRub: c.gExtra, extrasRub: c.extras,

    function buildDays(y, m) {
      const first = new Date(y, m, 1);
      const offset = (first.getDay() + 6) % 7;
      const total = new Date(y, m + 1, 0).getDate();
      let html = "";
      for (let i = 0; i < offset; i++) html += "<div></div>";
      for (let d = 1; d <= total; d++) {
        const ds = y + "-" + String(m + 1).padStart(2, "0") + "-" + String(d).padStart(2, "0");
        const busy = (CONFIG.BLOCKED[state.loft] || []).indexOf(ds) !== -1;
        const sel = state.date === ds;
        const r = getRate(ds, state.loft);
        const cls = "day-cell" + (busy ? " busy" : "") + (sel ? " selected" : "");
        const pr = busy ? "занято" : ((r.daily / 1000) + "к");
        html += `<button type="button" class="${cls}" onclick="setDate('${ds}')"><span class="d-num">${d}</span><span class="d-price">${pr}</span></button>`;
      }
      return html;
    }

      tgScript.src = "https://telegram.org/js/telegram-web-app.js";
